<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLAN Share | Local NAS</title>
    <link rel="stylesheet" href="/web-assets/css/style.css">
    <script src="/web-assets/js/lucide.min.js"></script>
</head>

<body>

    <div class="container">
        <header>
            <div class="header-left">
                <h1>Files</h1>
                <div class="breadcrumbs">
                    <i data-lucide="folder" size="14"></i>
                    <span id="current-path">{{CURRENT_PATH}}</span>
                </div>
            </div>
            <div class="toolbar">
                <button onclick="createFolder()">
                    <i data-lucide="folder-plus" size="18"></i>
                    New Folder
                </button>
                <button class="primary" onclick="document.getElementById('file-input').click()">
                    <i data-lucide="upload-cloud" size="18"></i>
                    Upload
                </button>
                <input type="file" id="file-input" multiple style="display:none" onchange="handleFiles(this.files)">
            </div>
        </header>

        <div class="file-list">
            {{FILE_LIST}}
        </div>
    </div>

    <div class="drop-zone" id="drop-zone">
        <div class="drop-message">
            <i data-lucide="upload-cloud" size="64" stroke-width="1.5" style="color:var(--accent)"></i>
            <h2 style="color:var(--text); margin:0;">Drop files to upload</h2>
            <p style="color:var(--subtext); margin:0;">Release to start transferring to this folder</p>
        </div>
    </div>

    <div id="upload-progress">
        <div class="progress-info">
            <div class="file-info">
                <span id="upload-filename">Uploading...</span>
                <span id="upload-speed" class="speed-info">0.0 MB/s</span>
            </div>
            <span id="upload-percent">0%</span>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-fill"></div>
        </div>
    </div>

    <script>
        // Init Lucide Icons
        lucide.createIcons();

        const currentPath = "{{CURRENT_PATH_ENCODED}}";

        // Drag and Drop
        const dropZone = document.getElementById('drop-zone');

        window.addEventListener('dragenter', (e) => {
            e.preventDefault();
            dropZone.classList.add('active');
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            if (e.relatedTarget === null) {
                dropZone.classList.remove('active');
            }
        });

        window.addEventListener('dragover', (e) => e.preventDefault());

        window.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('active');
            handleFiles(e.dataTransfer.files);
        });

        function handleFiles(files) {
            if (files.length === 0) return;
            Array.from(files).forEach(uploadFile);
        }

        function uploadFile(file) {
            const url = window.location.pathname.endsWith('/')
                ? window.location.pathname + encodeURIComponent(file.name)
                : window.location.pathname + '/' + encodeURIComponent(file.name);

            const progressBox = document.getElementById('upload-progress');
            const filenameSpan = document.getElementById('upload-filename');
            const percentSpan = document.getElementById('upload-percent');
            const fill = document.getElementById('progress-fill');

            progressBox.style.display = 'block';
            filenameSpan.textContent = file.name;

            const xhr = new XMLHttpRequest();
            xhr.open('PUT', url, true);

            const startTime = Date.now();

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const now = Date.now();
                    const percent = Math.round((e.loaded / e.total) * 100);
                    percentSpan.textContent = percent + '%';
                    fill.style.width = percent + '%';

                    const elapsed = (now - startTime) / 1000;
                    if (elapsed > 0) {
                        const speed = (e.loaded / 1024 / 1024) / elapsed;
                        document.getElementById('upload-speed').textContent = speed.toFixed(1) + ' MB/s';
                    }
                }
            };

            xhr.onload = () => {
                if (xhr.status === 200) {
                    setTimeout(() => {
                        progressBox.style.display = 'none';
                        window.location.reload();
                    }, 800);
                } else {
                    alert('Upload failed: ' + xhr.responseText);
                    progressBox.style.display = 'none';
                }
            };

            xhr.onerror = () => {
                alert('Network error during upload');
                progressBox.style.display = 'none';
            };

            xhr.send(file);
        }

        function createFolder() {
            const name = prompt("Enter folder name:");
            if (!name) return;

            const virtualPath = currentPath + (currentPath.endsWith('/') ? '' : '/') + encodeURIComponent(name);

            fetch('/api/mkdir?path=' + virtualPath, { method: 'POST' })
                .then(res => {
                    if (res.ok) window.location.reload();
                    else res.text().then(t => alert('Error: ' + t));
                });
        }

        function deleteItem(name) {
            if (!confirm('Delete ' + name + '?')) return;

            const virtualPath = currentPath + (currentPath.endsWith('/') ? '' : '/') + encodeURIComponent(name);

            fetch('/api/delete?path=' + virtualPath, { method: 'DELETE' })
                .then(res => {
                    if (res.ok) window.location.reload();
                    else res.text().then(t => alert('Error: ' + t));
                });
        }
    </script>

</body>

</html>
